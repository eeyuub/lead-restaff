services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: restaff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaff}
      POSTGRES_DB: restaff_leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaff"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://restaff:${POSTGRES_PASSWORD:-restaff}@postgres:5432/restaff_leads
      NODE_ENV: production
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      APIFY_TOKEN: ${APIFY_TOKEN}
      APIFY_ACTOR_ID: ${APIFY_ACTOR_ID:-lukaskrivka~google-maps-with-contact-details}
      APIFY_WEBHOOK_SECRET: ${APIFY_WEBHOOK_SECRET}
      WIISENDER_SERVER_URL: ${WIISENDER_SERVER_URL}
      WIISENDER_API_KEY: ${WIISENDER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-${PUBLIC_URL}}
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  postgres_data:
